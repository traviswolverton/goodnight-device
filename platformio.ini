; Desk Dashboard — ESP32 client
; See DESIGN.md for the hardware/pin decisions behind this config.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Pinned lower than esptool's default (460800): over a USB passthrough
; into a VM, the initial handshake works fine but switching to the faster
; upload baud rate mid-session fails ("No serial data received") — the
; passthrough link doesn't reliably sustain a live baud change. 115200 is
; slower to flash but solid. Bump this back up if flashing natively
; (no VM/passthrough in the way) and speed matters.
upload_speed = 115200

; TFT_eSPI reads its pin/driver config from include/User_Setup.h (see that
; file's own header comment) rather than the library's stock file — these
; two flags are what make that happen.
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h

; The board's default partition table (default.csv, two 0x140000/1.31MB
; OTA app slots + a 0x160000 spiffs partition this project never uses)
; was already at 99.7% flash usage before the CAMERA snapshot feature
; (TJpg_Decoder + its own fetch code) was added -- confirmed by building
; the pre-feature commit standalone, not assumed. That feature needs
; about 10.5KB more than the ~4.5KB of slack that left, and TJpg_Decoder
; (a JPEG decoder chosen specifically for its small footprint) isn't
; meaningfully shrinkable below that. min_spiffs.csv keeps the same
; dual ota_0/ota_1 layout ArduinoOTA needs, just grows each app slot to
; 0x1E0000/1.9MB by shrinking the unused spiffs partition to its
; minimum -- comfortable headroom (~67% used) for this feature and
; future ones.
;
; IMPORTANT: this is a partition TABLE change, not just a bigger app
; binary -- the table itself lives at a fixed flash offset (0x8000) and
; is only written by a full USB flash (`pio run -t upload`, plain USB
; environment, not the -ota one), never by an OTA update (espota only
; writes into whichever app slot the ALREADY-BURNED table already
; defines). A device still running the old default.csv table needs that
; one-time USB reflash before this build's OTA uploads will succeed --
; until then, an OTA attempt against it will be cleanly rejected (the
; new binary is larger than the old table's app slot), not corrupt
; anything, but it also won't update the device. See DESIGN.md's "Camera
; snapshot fetch" note.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.1.0
    bodmer/TJpg_Decoder @ ^1.1.0

; OTA upload once the firmware's own ArduinoOTA service is running (see
; ota.cpp) -- no USB/passthrough needed. Usage:
;   OTA_PASSWORD=<same value as secrets.h's OTA_PASSWORD> pio run -t upload -e esp32dev-ota
; upload_port is the board's mDNS hostname; if .local resolution doesn't
; work on your network/OS, override it on the CLI instead:
;   pio run -t upload -e esp32dev-ota --upload-port <device-ip>
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = desk-dashboard-esp32.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
