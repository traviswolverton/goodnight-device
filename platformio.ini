; Desk Dashboard — ESP32 client
; See DESIGN.md for the hardware/pin decisions behind this config.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Pinned lower than esptool's default (460800): over a USB passthrough
; into a VM, the initial handshake works fine but switching to the faster
; upload baud rate mid-session fails ("No serial data received") — the
; passthrough link doesn't reliably sustain a live baud change. 115200 is
; slower to flash but solid. Bump this back up if flashing natively
; (no VM/passthrough in the way) and speed matters.
upload_speed = 115200

; TFT_eSPI reads its pin/driver config from include/User_Setup.h (see that
; file's own header comment) rather than the library's stock file — these
; two flags are what make that happen.
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.1.0

; OTA upload once the firmware's own ArduinoOTA service is running (see
; ota.cpp) -- no USB/passthrough needed. Usage:
;   OTA_PASSWORD=<same value as secrets.h's OTA_PASSWORD> pio run -t upload -e esp32dev-ota
; upload_port is the board's mDNS hostname; if .local resolution doesn't
; work on your network/OS, override it on the CLI instead:
;   pio run -t upload -e esp32dev-ota --upload-port <device-ip>
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = desk-dashboard-esp32.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
